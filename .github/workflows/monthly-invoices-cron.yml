name: Monthly Invoice Cron Job

on:
  schedule:
    # Month-end candidate: daily at 18:20 UTC (23:50 IST).
    # The shell guard below only issues invoices on the last day of the month in IST.
    - cron: "20 18 * * *"
    # Retry failed invoice email delivery hourly.
    - cron: "20 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "current-month or retry-emails"
        required: false
        default: "current-month"
        type: choice
        options:
          - current-month
          - retry-emails

concurrency:
  group: monthly-invoices-cron
  cancel-in-progress: false

jobs:
  trigger-monthly-invoices:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve mode
        id: mode
        run: |
          MODE="${{ inputs.mode }}"

          if [ -z "$MODE" ]; then
            if [ "${{ github.event.schedule }}" = "20 * * * *" ]; then
              MODE="retry-emails"
            else
              MODE="current-month"
            fi
          fi

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Resolved mode: $MODE"

      - name: Check IST month-end guard
        id: month_end
        if: steps.mode.outputs.mode == 'current-month'
        run: |
          TODAY_MONTH=$(TZ=Asia/Kolkata date +%m)
          TOMORROW_MONTH=$(TZ=Asia/Kolkata date -d tomorrow +%m)

          echo "IST today month: $TODAY_MONTH"
          echo "IST tomorrow month: $TOMORROW_MONTH"

          if [ "$TODAY_MONTH" != "$TOMORROW_MONTH" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Today is the last day of the month in IST."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Not month-end in IST; skipping current-month invoice issue."
          fi

      - name: Trigger Monthly Invoices
        if: steps.mode.outputs.mode == 'retry-emails' || steps.month_end.outputs.run == 'true'
        run: |
          echo "Triggering monthly invoice cron job..."

          ENDPOINT="https://contcave.com/api/cron/monthly-invoices?mode=${{ steps.mode.outputs.mode }}"

          echo "Endpoint: $ENDPOINT"

          RESPONSE=$(curl -sS -w "\n%{http_code}" \
            --retry 3 --retry-delay 5 --max-time 60 \
            -X GET "$ENDPOINT" \
            -H "x-github-secret: ${{ secrets.CRON_SECRET }}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          RESPONSE_BODY=$(echo "$RESPONSE" | head -n -1)

          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $RESPONSE_BODY"

          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "Monthly invoice cron job executed successfully"
          else
            echo "Monthly invoice cron job failed with status: $HTTP_CODE"
            echo "Response: $RESPONSE_BODY"
            exit 1
          fi

      - name: Log Results
        if: always()
        run: |
          echo "Monthly invoice cron workflow completed at $(date -u) UTC"
